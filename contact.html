<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch with John Dussold for front-end development, design, and collaboration." />
    <title>John Dussold - Contact</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/styles.css" />
    <script type="module" src="./js/contact-me.js"></script>
  </head>
  <body>
    <main class="main">
      <h1 class="sr-only">Contact</h1>
      <nav class="navbar">
        <div class="name">john-dussold</div>
        <button type="button" class="toggle-button" aria-label="Toggle menu" aria-expanded="false" aria-controls="navbar-links">
          <span class="bar" aria-hidden="true"></span>
          <span class="bar" aria-hidden="true"></span>
          <span class="bar" aria-hidden="true"></span>
        </button>
        <div class="navbar-links" id="navbar-links">
          <ul>
            <li><a href="index.html">_hello</a></li>
            <li><a href="about-me.html">_about-me</a></li>
            <li><a href="projects.html">_projects</a></li>
            <li class="spacer"></li>
            <li class="active"><a href="./contact.html">_contact-me</a></li>
          </ul>
        </div>
      </nav>
      <div class="cp-container">
        <div class="cp-left-section">
          <div class="cp-top-section">
            <span aria-hidden="true">&#9662;</span>&nbsp;<span id="info-tab-text">contact-info</span>
          </div>
          <div class="cp-contact-info">
            <svg class="contact-icon" width="20" height="18" viewBox="0 0 20 18" aria-hidden="true">
              <use href="img/icons.svg#icon-email"/>
            </svg>
            <a href="mailto:jdussold@gmail.com">jdussold@gmail.com</a>
          </div>
          <div class="cp-phone-info">
            <svg class="contact-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <use href="img/icons.svg#icon-phone"/>
            </svg>
            <p>(612) 321-1219</p>
          </div>
          <div class="cp-contact-info-label">
            <span aria-hidden="true">&#9662;</span>&nbsp;<span>find-me-also-on</span>
          </div>
          <div class="cp-contact-info">
            <svg class="contact-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <use href="img/icons.svg#icon-link"/>
            </svg>
            <a
              href="https://www.instagram.com/dieselmation/"
              target="_blank"
              rel="noopener"
              >Instagram</a
            >
          </div>
          <div class="cp-contact-info">
            <svg class="contact-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <use href="img/icons.svg#icon-link"/>
            </svg>
            <a
              href="https://medium.com/@jdussold"
              target="_blank"
              rel="noopener"
              >Medium</a
            >
          </div>
          <div class="cp-contact-info">
            <svg class="contact-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <use href="img/icons.svg#icon-link"/>
            </svg>
            <a
              href="https://twitter.com/DussoldJohn"
              target="_blank"
              rel="noopener"
              >Twitter</a
            >
          </div>
          <div class="cp-contact-info">
            <svg class="contact-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <use href="img/icons.svg#icon-link"/>
            </svg>
            <a
              href="https://www.youtube.com/channel/UCjLIqvJFssq8uGxUrmLO83g"
              target="_blank"
              rel="noopener"
              >YouTube</a
            >
          </div>
        </div>
        <div class="info-section">
          <div class="cp-top-section">
            <div class="info-tab">
              <span class="info-tab-text">contact</span>
              <svg class="close-button" viewBox="0 0 11 10" aria-hidden="true">
                <use href="img/icons.svg#icon-close"/>
              </svg>
            </div>
            <div class="info-tab-spacer"></div>
          </div>
          <div class="cp-content">
            <form
              id="contact-form"
              action="https://formspree.io/f/xayzaolg"
              method="POST"
              target="form-iframe"
              autocomplete="off"
            >
              <label for="name">_name:</label>
              <input type="text" id="name" name="name" required />
              <label for="email">_email:</label>
              <input type="email" id="email" name="email" required />
              <label for="message">_message:</label>
              <textarea id="message" name="message" required></textarea>
              <button type="submit">submit-message</button>
            </form>
            <iframe
              name="form-iframe"
              class="hidden-iframe"
              title="Hidden Form Iframe"
            ></iframe>
            <div id="thank-you-section">
              <h2>Thank you! &#x1F918;</h2>
              <p>Your message has been sent.</p>
            </div>
          </div>
        </div>
        <div class="cp-examples-section">
          <div class="examples-top-section"></div>
          <div class="cp-examples-content">
            <pre><code class="cp-message-code-example"></code></pre>
          </div>
        </div>
      </div>
      <footer>
        <ul>
          <li><span>Find me on:</span></li>
          <li>
            <a
              href="https://twitter.com/DussoldJohn"
              target="_blank"
              rel="noopener"
            >
              <span class="sr-only">Twitter</span>
              <svg class="social-icon" width="21" height="17" viewBox="0 0 21 17" aria-hidden="true">
                <use href="img/icons.svg#icon-twitter"/>
              </svg>
            </a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/in/john-dussold"
              target="_blank"
              rel="noopener"
            >
              <span class="sr-only">LinkedIn</span>
              <svg class="social-icon" width="21" height="17" viewBox="0 0 310 310" aria-hidden="true">
                <use href="img/icons.svg#icon-linkedin"/>
              </svg>
            </a>
          </li>
          <li class="spacer"></li>
          <li>
            <a
              href="https://github.com/jdussold"
              target="_blank"
              rel="noopener"
            >
              <span>@jdussold</span>
              <svg class="social-icon" width="20" height="21" viewBox="0 0 20 21" aria-hidden="true">
                <use href="img/icons.svg#icon-github"/>
              </svg>
            </a>
          </li>
        </ul>
      </footer>
    </main>
  </body>
</html>
